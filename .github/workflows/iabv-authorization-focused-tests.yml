name: IABV authorization focused candidate tests

on:
  pull_request:
    paths:
      - "IABV_v1.5/src/iabv_v15/services/evolution/mcp_bridge_service.py"
      - "IABV_v1.5/src/iabv_v15/services/security/read_authorization.py"
      - "IABV_v1.5/src/iabv_v15/services/security/github_owner_merge_bootstrap.py"
      - "IABV_v1.5/src/iabv_v15/services/security/windows_crypto.py"
      - "IABV_v1.5/tests/test_mcp_bridge_service.py"
      - "IABV_v1.5/tests/test_read_authorization.py"
      - ".github/workflows/iabv-authorization-focused-tests.yml"

permissions:
  contents: read

jobs:
  focused-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: IABV_v1.5/src
      IABV_DATA_DIR: ${{ runner.temp }}/iabv-authz-test-data
    steps:
      - name: Check out the reviewed pull-request revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install only focused-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pydantic>=2.7,<3" "httpx>=0.27,<1"

      - name: Run bridge-start and authorization contract tests
        run: >-
          python -m pytest
          IABV_v1.5/tests/test_mcp_bridge_service.py
          IABV_v1.5/tests/test_read_authorization.py
          -q
