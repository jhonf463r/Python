name: IABV Actions runner preflight

"on":
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify hosted runner execution
        run: |
          echo "iabv-runner-preflight-started"
          python --version
