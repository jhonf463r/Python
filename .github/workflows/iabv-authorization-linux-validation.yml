name: IABV authorization candidate Linux validation

on:
  push:
    branches:
      - "codex/iabv-m1f-linux-validation-20261026"

permissions:
  contents: read

jobs:
  focused-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: IABV_v1.5/src
      IABV_DATA_DIR: ${{ runner.temp }}/iabv-authz-test-data-${{ github.run_id }}
    steps:
      - name: Check out isolated candidate
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check -e "IABV_v1.5[dev]"

      - name: Create isolated data directory
        run: mkdir -p "$IABV_DATA_DIR"

      - name: Run focused authorization contract suites
        run: >-
          python -m pytest
          IABV_v1.5/tests/test_mcp_bridge_service.py
          IABV_v1.5/tests/test_read_authorization.py
          IABV_v1.5/tests/test_windows_handle_reader.py
          -q
